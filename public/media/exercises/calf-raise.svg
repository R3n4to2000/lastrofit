<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-labelledby="title desc">
  <title id="title">Elevação de panturrilhas</title><desc id="desc">Figura simplificada alterna a altura dos calcanhares.</desc>
  <style>
    .move{animation:lift 2.8s ease-in-out infinite}@keyframes lift{0%,15%,85%,100%{transform:translateY(0)}45%,55%{transform:translateY(-15px)}}
    @media(prefers-reduced-motion:reduce){.move{animation:none}}
  </style>
  <rect width="400" height="260" rx="24" fill="#eaf2e7"/><path d="M48 218h304" stroke="#98ad9d" stroke-width="4"/>
  <g class="move" fill="none" stroke="#173e36" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="200" cy="55" r="20" fill="#b9df78" stroke="none"/><path d="M200 81v80m0-47-37 26m37-26 37 26m-37 21-27 50h-17m44-50 27 50h17"/>
  </g><path d="M296 198v-42m-9 10 9-10 9 10" fill="none" stroke="#386f58" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="24" y="35" fill="#173e36" font-family="Arial,sans-serif" font-size="15" font-weight="700">Prévia ilustrativa</text>
</svg>
