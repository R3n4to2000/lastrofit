project_id = "lastrofit"

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/confirm", "http://localhost:3000/auth/verificar"]

[auth.email]
enabled = true
enable_confirmations = true

[auth.email.template.confirmation]
subject = "Confirme sua conta LastroFit"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Recupere sua senha LastroFit"
content_path = "./supabase/templates/recovery.html"
